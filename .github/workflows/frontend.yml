name: Frontend DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: 'frontend' 

jobs:

########################################
# Security Checks
########################################
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for SCA
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
          args: ./${{ env.FRONTEND_DIR }} 
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}    

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1"

########################################
# Quality Checks
########################################
  quality:
    runs-on: ubuntu-latest
    needs: security-checks
    defaults:
      run:
        working-directory: './${{ env.FRONTEND_DIR }}' # Executes all npm steps inside the subfolder
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: './${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src

      - name: Run Unit Tests
        run: |
          CI=true npm test -- --coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./${{ env.FRONTEND_DIR }}/coverage/lcov.info 
          fail_ci_if_error: true

      - name: Build React Application
        run: npm run build

########################################
# Docker Build
########################################
  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devops-learning-platform
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build Image Locally
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.FRONTEND_DIR }} 
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-learning-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-learning-platform:test
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.FRONTEND_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
